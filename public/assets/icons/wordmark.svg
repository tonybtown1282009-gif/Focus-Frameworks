<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" role="img" aria-label="Focus Frameworks">
  <title>Focus Frameworks</title>
  <!-- Mark -->
  <g>
    <defs>
      <clipPath id="ff-wm-clip">
        <rect x="4" y="4" width="56" height="56" rx="12" />
      </clipPath>
    </defs>
    <g clip-path="url(#ff-wm-clip)">
      <g stroke="#2563EB" stroke-opacity="0.12" stroke-width="1">
        <line x1="16" y1="4" x2="16" y2="60" />
        <line x1="32" y1="4" x2="32" y2="60" />
        <line x1="48" y1="4" x2="48" y2="60" />
        <line x1="4" y1="16" x2="60" y2="16" />
        <line x1="4" y1="32" x2="60" y2="32" />
        <line x1="4" y1="48" x2="60" y2="48" />
      </g>
      <g stroke="#2563EB" stroke-width="3" stroke-linecap="round" fill="none">
        <line x1="8" y1="8" x2="28" y2="28" />
        <line x1="56" y1="8" x2="36" y2="28" />
        <line x1="8" y1="56" x2="28" y2="36" />
        <line x1="56" y1="56" x2="36" y2="36" />
      </g>
      <rect x="27" y="27" width="10" height="10" rx="2" fill="#2563EB" />
    </g>
  </g>
  <!-- Wordmark -->
  <text x="76" y="40" font-family="Geist, Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="-0.6" fill="#0F172A">Focus Frameworks</text>
</svg>
